name: CI

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: true

      - name: Sync project environment
        run: uv sync --locked --extra dev --extra api

      - name: Run tests
        run: uv run python -m pytest -q

      - name: Run lint
        run: uv run python -m ruff check .

      - name: Check release metadata
        run: uv run python -m pytest tests/test_release_metadata.py -q

      - name: Validate extras resolver contracts
        if: matrix.python-version == '3.12'
        run: |
          uv sync --locked --extra alcove --extra documents
          uv sync --locked --extra all

      - name: Build package
        if: matrix.python-version == '3.12'
        run: uv run python -m build

      - name: Smoke install built wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m venv .dist-smoke
          . .dist-smoke/bin/activate
          python -m pip install dist/*.whl
          alcove-dux catalog > /tmp/alcove-dux-catalog.json
          python -c "import alcove_dux; print(alcove_dux.__version__)"

      - name: Check package metadata
        if: matrix.python-version == '3.12'
        run: uv run python -m twine check dist/*

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
